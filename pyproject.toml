[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "netboost"
version = "1.0.0"
description = "One-click network diagnosis, speed test, and optimization tool"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.7"
keywords = ["network", "speed", "optimization", "diagnosis", "dns"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Environment :: Win32 (MS Windows)",
    "Environment :: MacOS X",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: System :: Networking",
    "Topic :: Utilities",
]

[project.scripts]
netboost = "netboost.__main__:main"

[project.urls]
Homepage = "https://github.com/yourname/netboost"
Repository = "https://github.com/yourname/netboost"
Issues = "https://github.com/yourname/netboost/issues"
